name: Refresh calendars

on:
  schedule:
    # 06:00 UTC daily. NFL flex changes are announced ~12 days ahead, so
    # daily catches everything with margin. ~30 runs a month.
    - cron: "0 6 * * *"
  workflow_dispatch:        # lets you trigger it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet icalendar

      # ---- LIVE SOURCES ----------------------------------------------
      # These two are the only calendars with a real upstream feed.
      # Everything else in the repo is static and is left untouched.

      - name: Fetch NFL schedule (nflverse)
        run: |
          curl -sSfL --retry 3 \
            https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv \
            -o build/nfl.csv

      - name: Fetch F1 session times (sportstimes)
        run: |
          curl -sSfL --retry 3 \
            https://raw.githubusercontent.com/sportstimes/f1/main/_db/f1/2026.json \
            -o build/f1.json

      - name: Rebuild calendars
        run: |
          cd build
          python make_nfl_full.py
          python make_f1_sessions.py

      # ---- VALIDATE BEFORE PUBLISHING --------------------------------
      # Never commit a file that will not parse. A broken .ics can wipe
      # a subscribed calendar on the client.

      - name: Validate
        run: |
          python - <<'PY'
          import glob, sys
          from icalendar import Calendar
          fail = False
          for p in sorted(glob.glob("docs/*.ics")):
              raw = open(p, "rb").read()
              try:
                  n = len(list(Calendar.from_ical(raw).walk("VEVENT")))
              except Exception as e:
                  print(f"FAIL parse {p}: {e}"); fail = True; continue
              longs = [l for l in raw.decode().split("\r\n")
                       if len(l.encode()) > 75]
              if n == 0:
                  print(f"FAIL empty {p}"); fail = True
              elif longs:
                  print(f"FAIL fold  {p}: {len(longs)} over-long lines"); fail = True
              else:
                  print(f"ok {p}: {n} events")
          sys.exit(1 if fail else 0)
          PY

      - name: Commit if anything changed
        run: |
          git config user.name  "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add docs/*.ics
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh calendars $(date -u +%Y-%m-%d)"
            git push
          fi
